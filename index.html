<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="api-base" content="https://couple-calendar-ycu9.onrender.com">
<title>Календарь на двоих</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --pending: 245, 158, 11;
    --accepted: 34, 197, 94;
    --declined: 239, 68, 68;
    --expired: 138, 138, 142;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 14px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Загрузка */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 90px 16px 0; text-align: center; color: var(--hint); }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--bg2); border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  /* Календарь */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-size: 20px; font-weight: 600; text-transform: capitalize; }
  .nav { width: 40px; height: 40px; border-radius: 50%; font-size: 22px; color: var(--accent); }
  .nav:active { background: var(--bg2); }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekdays span { text-align: center; font-size: 12px; color: var(--hint); padding: 4px 0; }
  .grid { gap: 2px; }
  .day { position: relative; aspect-ratio: 1 / 1; max-height: 54px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 2px solid transparent; font-size: 16px; }
  .day.today .num { color: var(--accent); font-weight: 700; }
  .day.selected { border-color: var(--accent); background: var(--bg2); }
  .dots { display: flex; gap: 3px; height: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.pending  { border: 2px solid rgb(var(--pending)); }
  .dot.accepted { background: rgb(var(--accepted)); }
  .dot.declined { background: rgb(var(--declined)); border-radius: 1px; transform: rotate(45deg); }
  .dot.expired  { border: 2px solid rgb(var(--expired)); }

  /* Список */
  .list-title { margin: 20px 0 10px; font-size: 15px; font-weight: 600; color: var(--hint); }
  .empty { padding: 28px 12px; text-align: center; color: var(--hint); }
  .card { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    border-left: 5px solid rgb(var(--c)); background: rgba(var(--c), .13); }
  .card.pending  { --c: var(--pending); }
  .card.accepted { --c: var(--accepted); }
  .card.declined { --c: var(--declined); }
  .card.expired  { --c: var(--expired); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 { margin: 0; font-size: 17px; word-break: break-word; flex: 1; }
  .card .tag { margin-top: 2px; font-size: 13px; color: var(--hint); }
  .card-actions { display: flex; gap: 6px; }
  .icon-btn { font-size: 16px; padding: 4px 6px; opacity: .7; border-radius: 6px; }
  .icon-btn:hover { opacity: 1; background: rgba(0,0,0,.05); }
  .card p { margin: 4px 0 0; color: var(--text); opacity: .8; white-space: pre-wrap; word-break: break-word; }
  .meta { margin-top: 8px; font-size: 13px; color: var(--hint); display: flex; justify-content: space-between; gap: 8px; }
  .meta b { color: rgb(var(--c)); font-weight: 600; }
  .answer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .answer.one { grid-template-columns: 1fr; }
  .answer button { padding: 13px 0; border-radius: 12px; font-weight: 600; font-size: 17px; color: #fff; }
  .answer .yes { background: rgb(var(--accepted)); }
  .answer .no { background: rgb(var(--declined)); }
  .answer .soft { background: rgba(0,0,0,.07); color: var(--text); font-size: 15px; padding: 10px 0; }
  .answer button:disabled { opacity: .5; }
  .link-btn { display: block; margin: 24px auto 0; padding: 8px; color: var(--hint); font-size: 14px; text-decoration: underline; }

  /* Кнопка + */
  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    font-size: 32px; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .fab:active { transform: scale(.94); }

  /* Форма */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 20px 20px 0 0;
    max-height: 92vh; overflow-y: auto;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h2 { margin: 0 0 14px; font-size: 19px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid transparent;
    background: var(--bg2); color: var(--text); font: inherit; }
  textarea { resize: none; min-height: 80px; }
  .two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 18px; }
  .btn { padding: 14px; border-radius: 12px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.ghost { background: var(--bg2); }
  .btn:disabled { opacity: .5; }
  .error { color: rgb(var(--declined)); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .hint { font-size: 13px; color: var(--hint); margin-top: 12px; }

  /* Кнопки идей для секса */
  .sex-ideas { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 6px; }
  .sex-idea-btn { padding: 10px 12px; border-radius: 10px; background: var(--bg2); font-size: 14px; font-weight: 500; text-align: left; border: 2px solid transparent; transition: all .15s; }
  .sex-idea-btn.active { border-color: var(--accent); background: rgba(36, 129, 204, 0.12); font-weight: 600; }

  /* Список покупок */
  .checklist { margin-top: 10px; }
  .checklist-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .checklist-item:last-child { border-bottom: 0; }
  .checklist-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: rgb(var(--accepted)); flex-shrink: 0; cursor: pointer; padding: 0; }
  .checklist-item .cl-text { flex: 1; word-break: break-word; }
  .checklist-item.checked .cl-text { text-decoration: line-through; opacity: .55; }
  .checklist-item .cl-remove { font-size: 18px; opacity: .5; padding: 2px 8px; border-radius: 6px; }
  .checklist-item .cl-remove:hover { opacity: 1; background: rgba(0,0,0,.05); }
  .cl-empty { padding: 8px 0; font-size: 14px; color: var(--hint); }
  .cl-add-row { display: flex; gap: 8px; margin-top: 10px; }
  .cl-add-row input { flex: 1; }
  .cl-add-row button { padding: 0 14px; border-radius: 12px; background: var(--bg2); font-weight: 600; white-space: nowrap; }
  .cl-add-row button:active { background: var(--accent); color: var(--accent-text); }
  .card .checklist { background: rgba(0,0,0,.03); border-radius: 10px; padding: 4px 10px; }
  .card .checklist-item .cl-text { font-size: 15px; }
  .card .cl-add-row { margin-top: 8px; }

  /* Нет партнёра */
  .welcome { text-align: center; padding: 60px 8px 0; }
  .welcome h1 { font-size: 24px; margin: 0 0 10px; }
  .welcome p { color: var(--hint); margin: 0 0 24px; }
  .welcome .btn { display: block; width: 100%; margin-bottom: 10px; }

  .toasts { position: fixed; left: 0; right: 0; top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 20; pointer-events: none; }
  .toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90%; }
</style>
</head>
<body>

<section id="loading" class="loading" role="status">
  <div class="spinner" id="loadingSpinner" aria-hidden="true"></div>
  <p id="loadingHint">Подключаемся…</p>
</section>

<section id="welcome" class="welcome" hidden>
  <h1>Календарь на двоих</h1>
  <p>Чтобы начать, отправьте пригласительную ссылку второму человеку. Когда он откроет её в боте, вы будете связаны.</p>
  <button class="btn primary" id="share">Отправить ссылку партнёру</button>
  <button class="btn ghost" id="copy">Скопировать ссылку</button>
</section>

<main id="app" hidden>
  <div class="cal-head">
    <button class="nav" id="prev" aria-label="Предыдущий месяц">‹</button>
    <div class="cal-title" id="title" aria-live="polite"></div>
    <button class="nav" id="next" aria-label="Следующий месяц">›</button>
  </div>
  <div class="weekdays" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
  <div class="grid" id="grid"></div>

  <div class="list-title" id="listTitle"></div>
  <div id="list"></div>

  <button class="link-btn" id="unlink">Отвязать партнёра</button>
  <button class="fab" id="add" aria-label="Добавить событие">+</button>
</main>

<!-- Форма создания / редактирования -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Новое событие</h2>

    <div class="two">
      <div>
        <label for="fDate">Дата</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label for="fTime">Время (необязательно)</label>
        <input type="time" id="fTime">
      </div>
    </div>

    <label for="fCategory">Категория</label>
    <select id="fCategory">
      <option value="rest">Отдых</option>
      <option value="sex">Секс</option>
      <option value="shop">Магазин</option>
    </select>

    <label for="fDesc">Описание (необязательно)</label>
    <textarea id="fDesc" maxlength="2000"></textarea>

    <!-- Выбор готовых идей для категории Секс (теперь после описания) -->
    <div id="sexIdeasSection" hidden>
      <label>Выберите идею</label>
      <div class="sex-ideas">
        <button type="button" class="sex-idea-btn active" data-title="🔥 Страстная ночь">🔥 Страстная ночь</button>
        <button type="button" class="sex-idea-btn" data-title="🌹 Романтический вечер">🌹 Романтический вечер</button>
        <button type="button" class="sex-idea-btn" data-title="✨ Эксперименты и фантазии">✨ Эксперименты и фантазии</button>
      </div>
    </div>

    <div id="checklistSection" hidden>
      <label>Список покупок</label>
      <div class="checklist" id="fChecklist"></div>
      <div class="cl-add-row">
        <input type="text" id="fClInput" placeholder="Добавить пункт..." maxlength="200" aria-label="Новый пункт списка">
        <button type="button" id="fClAdd" aria-label="Добавить пункт">+</button>
      </div>
    </div>

    <div class="hint" id="fHint" hidden>Если изменить дату, время или категорию, партнёру придётся ответить заново.</div>

    <div class="error" id="fError" role="alert"></div>
    <div class="row">
      <button class="btn ghost" id="fCancel">Отмена</button>
      <button class="btn primary" id="fSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
const tg = window.Telegram?.WebApp || {
  initData: "",
  ready: () => {},
  expand: () => {},
  openTelegramLink: (url) => window.open(url, "_blank")
};
try { tg.ready(); tg.expand(); } catch (e) { console.log("Запуск вне Telegram"); }

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const CATEGORIES = {
  rest: { label: "Отдых",   icon: "🌿" },
  sex:  { label: "Секс",    icon: "🔥" },
  shop: { label: "Магазин", icon: "🛒" },
};
const STATUS_TEXT = {
  pending: "⏳ Ждёт ответа", accepted: "✓ Принято", declined: "✕ Отклонено", expired: "Просрочено",
};
const MONTHS_FORMAT = new Intl.DateTimeFormat("ru", { month: "long", year: "numeric" });
const DAY_FORMAT = new Intl.DateTimeFormat("ru", { day: "numeric", month: "long" });

const pad = (n) => String(n).padStart(2, "0");
const fmt = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayStr = () => { const t = new Date(); return fmt(t.getFullYear(), t.getMonth(), t.getDate()); };
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch { return ""; } })();

let state = { has_partner: false, invite_link: "", events: [] };
let selected = todayStr();
let view = (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();
let editingEvent = null;
let loaded = false;
let selectedSexTitle = "🔥 Страстная ночь";
const monthKey = () => `${view.y}-${pad(view.m + 1)}`;
const monthCache = {};

const API_BASE = (document.querySelector('meta[name="api-base"]')?.content || "").replace(/\/$/, "");

class HttpError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

async function request(path, { method = "GET", body, etag } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const headers = { "X-Init-Data": tg.initData || "", "X-TZ": TZ };
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (etag) headers["If-None-Match"] = etag;
    const res = await fetch(API_BASE + "/api" + path, {
      method, headers, signal: ctrl.signal, cache: "no-store",
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (res.status === 304) return { status: 304 };
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new HttpError(data.error || "Что-то пошло не так", res.status);
    return { status: res.status, data, etag: res.headers.get("ETag") };
  } catch (e) {
    if (e instanceof HttpError) throw e;
    throw new HttpError(e.name === "AbortError" ? "Сервер не отвечает." : "Нет соединения с сервером.", 0);
  } finally {
    clearTimeout(timer);
  }
}
const api = async (path, opts) => (await request(path, opts)).data;

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function confirmDialog(message, onYes) {
  try {
    if (tg.showConfirm) { tg.showConfirm(message, (ok) => { if (ok) onYes(); }); return; }
  } catch (e) {}
  if (confirm(message)) onYes();
}

let etag = null, etagKey = "";

async function load(silent = false) {
  const key = monthKey();
  try {
    const r = await request("/state?month=" + key, { etag: etagKey === key ? etag : null });
    if (key !== monthKey()) return;
    if (r.status === 304) return;
    state = r.data; etag = r.etag; etagKey = key;
    monthCache[key] = state.events;
    render();
  } catch (e) {
    if (!loaded) throw e;
    if (!silent) toast(e.message);
  }
}

async function bootstrap() {
  const hint = $("loadingHint");
  const slow = setTimeout(() => { hint.textContent = "Сервер просыпается, это может занять до минуты…"; }, 5000);
  for (;;) {
    try { await load(); break; }
    catch (e) {
      if (e.status === 401) {
        clearTimeout(slow);
        $("loadingSpinner").hidden = true;
        hint.textContent = "Откройте приложение через бота в Telegram.";
        return;
      }
      hint.textContent = e.message + " Пробуем снова…";
      await sleep(3000);
    }
  }
  clearTimeout(slow);
  loaded = true;
  $("loading").hidden = true;
  render();
  startPolling();
}

function render() {
  $("welcome").hidden = state.has_partner;
  $("app").hidden = !state.has_partner;
  if (state.has_partner) { renderCalendar(); renderList(); }
}

function statusKey(e) { return e.status === "pending" && e.date < todayStr() ? "expired" : e.status; }

function renderCalendar() {
  $("title").textContent = MONTHS_FORMAT.format(new Date(view.y, view.m, 1));

  const byDay = {};
  for (const e of state.events) (byDay[e.date] ||= []).push(e);

  const offset = (new Date(view.y, view.m, 1).getDay() + 6) % 7;
  const days = new Date(view.y, view.m + 1, 0).getDate();
  const today = todayStr();
  let html = "";
  for (let i = 0; i < offset; i++) html += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const date = fmt(view.y, view.m, d);
    const list = byDay[date] || [];
    const st = new Set(list.map(statusKey));
    const dots = ["pending", "accepted", "declined", "expired"]
      .filter((s) => st.has(s)).map((s) => `<i class="dot ${s}"></i>`).join("");
    const cls = ["day", date === today && "today", date === selected && "selected"].filter(Boolean).join(" ");
    const label = DAY_FORMAT.format(new Date(view.y, view.m, d)) + (list.length ? `, событий: ${list.length}` : "");
    html += `<button class="${cls
