<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Календарь на двоих</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --pending: 245, 158, 11;
    --accepted: 34, 197, 94;
    --declined: 239, 68, 68;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 14px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Календарь */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-size: 20px; font-weight: 600; text-transform: capitalize; }
  .nav { width: 40px; height: 40px; border-radius: 50%; font-size: 22px; color: var(--accent); }
  .nav:active { background: var(--bg2); }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekdays span { text-align: center; font-size: 12px; color: var(--hint); padding: 4px 0; }
  .grid { gap: 2px; }
  .day { position: relative; aspect-ratio: 1 / 1; max-height: 54px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 2px solid transparent; font-size: 16px; }
  .day.today .num { color: var(--accent); font-weight: 700; }
  .day.selected { border-color: var(--accent); background: var(--bg2); }
  .dots { display: flex; gap: 3px; height: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot.pending { background: rgb(var(--pending)); }
  .dot.accepted { background: rgb(var(--accepted)); }
  .dot.declined { background: rgb(var(--declined)); }

  /* Список */
  .list-title { margin: 20px 0 10px; font-size: 15px; font-weight: 600; color: var(--hint); }
  .empty { padding: 28px 12px; text-align: center; color: var(--hint); }
  .card { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    border-left: 5px solid rgb(var(--c)); background: rgba(var(--c), .13); }
  .card.pending  { --c: var(--pending); }
  .card.accepted { --c: var(--accepted); }
  .card.declined { --c: var(--declined); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 { margin: 0; font-size: 17px; word-break: break-word; flex: 1; }
  .card-actions { display: flex; gap: 6px; }
  .icon-btn { font-size: 16px; padding: 4px 6px; opacity: .7; border-radius: 6px; }
  .icon-btn:hover { opacity: 1; background: rgba(0,0,0,.05); }
  .card p { margin: 4px 0 0; color: var(--text); opacity: .8; white-space: pre-wrap; word-break: break-word; }
  
  /* Чек-лист в карточке */
  .checklist-view { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .checklist-item-view { display: flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; }
  .checklist-item-view input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .checklist-item-view.checked span { text-decoration: line-through; opacity: 0.5; }

  .meta { margin-top: 8px; font-size: 13px; color: var(--hint); display: flex; justify-content: space-between; gap: 8px; }
  .meta b { color: rgb(var(--c)); font-weight: 600; }
  .answer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .answer button { padding: 13px 0; border-radius: 12px; font-weight: 600; font-size: 17px; color: #fff; }
  .answer .yes { background: rgb(var(--accepted)); }
  .answer .no { background: rgb(var(--declined)); }
  .answer button:disabled { opacity: .5; }

  /* Кнопка + */
  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    font-size: 32px; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .fab:active { transform: scale(.94); }

  /* Форма */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 90vh; overflow-y: auto; animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h2 { margin: 0 0 14px; font-size: 19px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid transparent;
    background: var(--bg2); color: var(--text); font: inherit; }
  textarea { resize: none; min-height: 80px; }

  /* Конструктор чек-листа в форме */
  .checklist-builder { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .checklist-row { display: flex; gap: 8px; }
  .checklist-row input { flex: 1; }
  .checklist-row button { padding: 0 14px; background: var(--bg2); border-radius: 12px; font-weight: 600; color: rgb(var(--declined)); }

  .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 18px; }
  .btn { padding: 14px; border-radius: 12px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.ghost { background: var(--bg2); }
  .btn:disabled { opacity: .5; }
  .error { color: rgb(var(--declined)); font-size: 14px; margin-top: 10px; min-height: 1em; }

  /* Нет партнёра */
  .welcome { text-align: center; padding: 60px 8px 0; }
  .welcome h1 { font-size: 24px; margin: 0 0 10px; }
  .welcome p { color: var(--hint); margin: 0 0 24px; }
  .welcome .btn { display: block; width: 100%; margin-bottom: 10px; }

  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: 90%; }
</style>
</head>
<body>

<!-- Экран: партнёр не привязан -->
<section id="welcome" class="welcome" hidden>
  <h1>Календарь на двоих</h1>
  <p>Чтобы начать, отправьте пригласительную ссылку второму человеку. Когда он откроет её в боте, вы будете связаны.</p>
  <button class="btn primary" id="share">Отправить ссылку партнёру</button>
  <button class="btn ghost" id="copy">Скопировать ссылку</button>
</section>

<!-- Экран: календарь -->
<main id="app" hidden>
  <div class="cal-head">
    <button class="nav" id="prev" aria-label="Предыдущий месяц">‹</button>
    <div class="cal-title" id="title"></div>
    <button class="nav" id="next" aria-label="Следующий месяц">›</button>
  </div>
  <div class="weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
  <div class="grid" id="grid"></div>

  <div class="list-title" id="listTitle"></div>
  <div id="list"></div>

  <button class="fab" id="add" aria-label="Добавить событие">+</button>
</main>

<!-- Форма создания / редактирования -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Новое событие</h2>
    <label for="fDate">Дата</label>
    <input type="date" id="fDate">
    
    <label for="fTitle">Категория</label>
    <select id="fTitle">
      <option value="Отдых">Отдых</option>
      <option value="Секс">Секс</option>
      <option value="Магазин">Магазин</option>
    </select>

    <label for="fDesc">Описание (необязательно)</label>
    <textarea id="fDesc" maxlength="2000" placeholder="Дополнительная информация..."></textarea>

    <div id="checklistContainer" hidden>
      <label style="margin-top: 12px;">Список покупок</label>
      <div class="checklist-builder" id="checklistBuilder"></div>
      <button class="btn ghost" id="addChecklistItem" style="margin-top: 8px; width: 100%;">+ Добавить пункт</button>
    </div>

    <div class="error" id="fError"></div>
    <div class="row">
      <button class="btn ghost" id="fCancel">Отмена</button>
      <button class="btn primary" id="fSave">Сохранить</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp || {
  initData: "",
  ready: () => {},
  expand: () => {},
  openTelegramLink: (url) => window.open(url, "_blank")
};

try {
  tg.ready();
  tg.expand();
} catch (e) {
  console.log("Запуск вне Telegram");
}

const $ = (id) => document.getElementById(id);
const STATUS_TEXT = { pending: "Ждёт ответа", accepted: "Принято", declined: "Отклонено" };
const MONTHS_FORMAT = new Intl.DateTimeFormat("ru", { month: "long", year: "numeric" });
const DAY_FORMAT = new Intl.DateTimeFormat("ru", { day: "numeric", month: "long" });

const pad = (n) => String(n).padStart(2, "0");
const fmt = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayStr = () => { const t = new Date(); return fmt(t.getFullYear(), t.getMonth(), t.getDate()); };
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

let state = { has_partner: false, invite_link: "", events: [] };
let selected = todayStr();
let view = (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();
let editingEventId = null;

const RENDER_SERVER_URL = "https://couple-calendar-ycu9.onrender.com";

async function api(path, options = {}) {
  const res = await fetch(RENDER_SERVER_URL + "/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Init-Data": tg.initData || "" }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Что-то пошло не так");
  return data;
}

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

async function load() {
  // Не перезагружаем список с сервера, если открыта форма или пользователь кликает по чекбоксу
  if (!$("overlay").hidden) return;
  try {
    const newState = await api("/state");
    // Сравниваем базово, чтобы не перерисовывать DOM без изменений
    state = newState;
    render();
  } catch (e) {
    console.error(e);
  }
}

function render() {
  $("welcome").hidden = state.has_partner;
  $("app").hidden = !state.has_partner;
  if (state.has_partner) { renderCalendar(); renderList(); }
}

function renderCalendar() {
  $("title").textContent = MONTHS_FORMAT.format(new Date(view.y, view.m, 1));
  const byDay = {};
  for (const e of state.events) (byDay[e.date] ||= new Set()).add(e.status);

  const offset = (new Date(view.y, view.m, 1).getDay() + 6) % 7;
  const days = new Date(view.y, view.m + 1, 0).getDate();
  const today = todayStr();
  let html = "";
  for (let i = 0; i < offset; i++) html += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const date = fmt(view.y, view.m, d);
    const st = byDay[date] || new Set();
    const dots = ["pending", "accepted", "declined"]
      .filter((s) => st.has(s)).map((s) => `<i class="dot ${s}"></i>`).join("");
    const cls = ["day", date === today && "today", date === selected && "selected"].filter(Boolean).join(" ");
    html += `<button class="${cls}" data-date="${date}" aria-pressed="${date === selected}">
               <span class="num">${d}</span><span class="dots">${dots}</span></button>`;
  }
  $("grid").innerHTML = html;
}

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function parsePayload(desc, title) {
  try {
    const data = JSON.parse(desc);
    if (data && typeof data === "object" && Array.isArray(data.items)) {
      data.items = data.items.map(item => ({
        id: item.id || Math.random().toString(36).substr(2, 9),
        text: item.text || "",
        done: !!item.done
      }));
      return data;
    }
  } catch (e) {}
  
  if (title === "Магазин") {
    return { text: desc || "", items: [] };
  }
  return null;
}

function renderList() {
  $("listTitle").textContent = "События · " + DAY_FORMAT.format(parse(selected));
  const items = state.events.filter((e) => e.date === selected);
  if (!items.length) {
    $("list").innerHTML = `<div class="empty">На этот день ничего нет. Нажмите «+», чтобы добавить событие.</div>`;
    return;
  }
  $("list").innerHTML = items.map((e) => {
    const answer = !e.is_creator && e.status === "pending"
      ? `<div class="answer">
           <button class="yes" data-id="${e.id}" data-status="accepted">Да</button>
           <button class="no" data-id="${e.id}" data-status="declined">Нет</button>
         </div>` : "";

    let contentHtml = "";
    const payload = parsePayload(e.description, e.title);
    
    if (e.title === "Магазин" && payload) {
      if (payload.text) {
        contentHtml += `<p>${esc(payload.text)}</p>`;
      }
      if (payload.items && payload.items.length > 0) {
        contentHtml += `<div class="checklist-view">` + payload.items.map((item) => `
          <label class="checklist-item-view ${item.done ? 'checked' : ''}">
            <input type="checkbox" data-checklist-id="${item.id}" data-event-id="${e.id}" ${item.done ? 'checked' : ''}>
            <span>${esc(item.text)}</span>
          </label>
        `).join("") + `</div>`;
      }
    } else if (e.description) {
      contentHtml = `<p>${esc(e.description)}</p>`;
    }

    return `<article class="card ${e.status}" data-id="${e.id}">
      <div class="card-header">
        <h3>${esc(e.title)}</h3>
        <div class="card-actions">
          <button class="icon-btn edit-btn" title="Редактировать">✏️</button>
          <button class="icon-btn delete-btn" title="Удалить">🗑️</button>
        </div>
      </div>
      ${contentHtml}
      <div class="meta"><span>${e.is_creator ? "От вас" : "От партнёра"}</span><b>${STATUS_TEXT[e.status]}</b></div>
      ${answer}
    </article>`;
  }).join("");
}

$("grid").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".day");
  if (!btn) return;
  selected = btn.dataset.date;
  tg.HapticFeedback?.selectionChanged();
  renderCalendar();
  renderList();
});

function shiftMonth(delta) {
  const d = new Date(view.y, view.m + delta, 1);
  view = { y: d.getFullYear(), m: d.getMonth() };
  const t = new Date();
  const sameAsToday = view.y === t.getFullYear() && view.m === t.getMonth();
  selected = sameAsToday ? todayStr() : fmt(view.y, view.m, 1);
  renderCalendar();
  renderList();
}
$("prev").onclick = () => shiftMonth(-1);
$("next").onclick = () => shiftMonth(1);

// Мгновенный отклик чекбокса без ожидания перерисовки списка
$("list").addEventListener("change", async (ev) => {
  const checkbox = ev.target.closest("input[type='checkbox'][data-checklist-id]");
  if (!checkbox) return;

  const eventId = checkbox.dataset.eventId;
  const itemId = checkbox.dataset.checklistId;
  const event = state.events.find(e => String(e.id) === String(eventId));
  if (!event) return;

  const payload = parsePayload(event.description, event.title);
  if (payload && payload.items) {
    const item = payload.items.find(i => i.id === itemId);
    if (item) {
      item.done = checkbox.checked;
      
      // Мгновенно обновляем визуальный класс без перерисовки всего списка
      const label = checkbox.closest(".checklist-item-view");
      if (label) {
        if (checkbox.checked) label.classList.add("checked");
        else label.classList.remove("checked");
      }

      tg.HapticFeedback?.selectionChanged();

      try {
        await api(`/events/${eventId}`, {
          method: "PUT",
          body: JSON.stringify({ title: event.title, description: JSON.stringify(payload), date: event.date })
        });
      } catch (e) {
        toast(e.message);
        load(); // в случае ошибки откатываемся назад
      }
    }
  }
});

$("list").addEventListener("click", async (ev) => {
  const card = ev.target.closest(".card");
  if (!card) return;
  const eventId = card.dataset.id;
  const event = state.events.find(e => String(e.id) === String(eventId));

  const statusBtn = ev.target.closest("[data-status]");
  if (statusBtn) {
    statusBtn.parentElement.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      await api(`/events/${eventId}`, {
        method: "POST", body: JSON.stringify({ status: statusBtn.dataset.status })
      });
      tg.HapticFeedback?.notificationOccurred("success");
      await load();
    } catch (e) {
      toast(e.message);
      await load();
    }
    return;
  }

  if (ev.target.closest(".edit-btn")) {
    editingEventId = Number(eventId);
    $("sheetTitle").textContent = "Редактировать событие";
    $("fDate").value = event.date;
    $("fTitle").value = event.title;
    toggleCategoryFields(event.title);

    const payload = parsePayload(event.description, event.title);
    if (event.title === "Магазин" && payload) {
      $("fDesc").value = payload.text || "";
      renderChecklistBuilder(payload.items || []);
    } else {
      $("fDesc").value = event.description || "";
      renderChecklistBuilder([]);
    }

    $("fError").textContent = "";
    $("overlay").hidden = false;
    return;
  }

  if (ev.target.closest(".delete-btn")) {
    if (!confirm("Удалить это событие?")) return;
    try {
      await api(`/events/${eventId}`, { method: "DELETE" });
      tg.HapticFeedback?.notificationOccurred("success");
      toast("Событие удалено");
      await load();
    } catch (e) {
      toast(e.message);
    }
  }
});

function toggleCategoryFields(category) {
  if (category === "Магазин") {
    $("checklistContainer").hidden = false;
  } else {
    $("checklistContainer").hidden = true;
  }
}

$("fTitle").addEventListener("change", (e) => {
  toggleCategoryFields(e.target.value);
  if (e.target.value === "Магазин" && $("checklistBuilder").children.length === 0) {
    renderChecklistBuilder([{ id: Math.random().toString(36).substr(2, 9), text: "", done: false }]);
  }
});

function renderChecklistBuilder(items) {
  const container = $("checklistBuilder");
  container.innerHTML = items.map((item) => `
    <div class="checklist-row" data-item-id="${item.id}">
      <input type="text" class="checklist-input" value="${esc(item.text)}" placeholder="Название товара">
      <button type="button" class="remove-checklist-row">✕</button>
    </div>
  `).join("");
}

$("addChecklistItem").onclick = () => {
  const container = $("checklistBuilder");
  const div = document.createElement("div");
  div.className = "checklist-row";
  const newId = Math.random().toString(36).substr(2, 9);
  div.setAttribute("data-item-id", newId);
  div.innerHTML = `
    <input type="text" class="checklist-input" value="" placeholder="Название товара">
    <button type="button" class="remove-checklist-row">✕</button>
  `;
  container.appendChild(div);
  div.querySelector("input").focus();
};

$("checklistBuilder").addEventListener("click", (e) => {
  if (e.target.classList.contains("remove-checklist-row")) {
    e.target.closest(".checklist-row").remove();
  }
});

function openForm() {
  editingEventId = null;
  $("sheetTitle").textContent = "Новое событие";
  $("fDate").value = selected;
  $("fTitle").value = "Отдых";
  toggleCategoryFields("Отдых");
  $("fDesc").value = "";
  renderChecklistBuilder([{ id: Math.random().toString(36).substr(2, 9), text: "", done: false }]);
  $("fError").textContent = "";
  $("overlay").hidden = false;
}
const closeForm = () => { $("overlay").hidden = true; };

$("add").onclick = openForm;
$("fCancel").onclick = closeForm;
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeForm(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeForm(); });

$("fSave").onclick = async () => {
  const title = $("fTitle").value;
  const date = $("fDate").value;
  if (!date) { $("fError").textContent = "Выберите дату"; return; }

  let description = "";
  const plainDesc = $("fDesc").value.trim();

  if (title === "Магазин") {
    const rows = document.querySelectorAll(".checklist-row");
    const items = [];
    rows.forEach(r => {
      const input = r.querySelector(".checklist-input");
      const text = input ? input.value.trim() : "";
      if (text) {
        items.push({
          id: r.dataset.itemId || Math.random().toString(36).substr(2, 9),
          text,
          done: false
        });
      }
    });
    description = JSON.stringify({ text: plainDesc, items });
  } else {
    description = plainDesc;
  }

  $("fSave").disabled = true;
  try {
    if (editingEventId) {
      await api(`/events/${editingEventId}`, {
        method: "PUT",
        body: JSON.stringify({ title, description, date })
      });
      toast("Событие изменено");
    } else {
      await api("/events", {
        method: "POST",
        body: JSON.stringify({ title, description, date })
      });
    }
    tg.HapticFeedback?.notificationOccurred("success");
    selected = date;
    const d = parse(date);
    view = { y: d.getFullYear(), m: d.getMonth() };
    closeForm();
    await load();
  } catch (e) {
    $("fError").textContent = e.message;
  } finally {
    $("fSave").disabled = false;
  }
};

$("share").onclick = () => {
  const url = "https://t.me/share/url?url=" + encodeURIComponent(state.invite_link) +
              "&text=" + encodeURIComponent("Давай вести общий календарь на двоих!");
  tg.openTelegramLink(url);
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(state.invite_link); toast("Ссылка скопирована"); }
  catch { toast(state.invite_link); }
};

load();
setInterval(() => { if (!document.hidden && $("overlay").hidden) load(); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
