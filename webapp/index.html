  <!-- Блок «Настроение дня» -->
  <div id="moodBlock" class="mood-block" hidden>
    <div class="mood-head" id="moodToggle">
      <div class="mood-title">💭 Настроение дня <span class="mood-chevron">▼</span></div>
      <button class="mood-edit" id="moodEditBtn" type="button" hidden>Изменить</button>
    </div>
    
    <div class="mood-body" id="moodBody">
      <!-- 1. Плашки, если настроение уже есть -->
      <div class="mood-row" id="moodRow" hidden></div>

      <!-- 2. Поле ввода, если настроения нет -->
      <div class="mood-quick-input" id="moodQuickInput">
        <div class="mood-quick-row">
          <select id="moodQuickEmoji" class="mood-quick-select" aria-label="Выберите эмодзи">
            <option value="">💭</option>
            <option value="😊">😊</option>
            <option value="😐">😐</option>
            <option value="😔">😔</option>
            <option value="😡">😡</option>
            <option value="🥰">🥰</option>
            <option value="😴">😴</option>
            <option value="🤒">🤒</option>
            <option value="🤩">🤩</option>
            <option value="😢">😢</option>
            <option value="😤">😤</option>
            <option value="🥳">🥳</option>
            <option value="🤔">🤔</option>
          </select>
          <input type="text" id="moodQuickText" placeholder="Что происходит? (необязательно)" maxlength="280">
          <button type="button" id="moodQuickSave" class="btn primary" style="padding: 0 14px; border-radius: 10px;">ОК</button>
        </div>
      </div>
    </div>
  </div>
